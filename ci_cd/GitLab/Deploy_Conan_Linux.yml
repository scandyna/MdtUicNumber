
include:
  - component: $CI_SERVER_FQDN/scandyna/gitlab-ci-cd-cpp-components/Conan_Deploy_NoArch@0.0.23
    inputs:
      job_name_suffix: '_Tier1'
      components:
        - 'mdtuicnumber'
  - component: $CI_SERVER_FQDN/scandyna/gitlab-ci-cd-cpp-components/Conan_Deploy_NoArch@0.0.23
    inputs:
      job_name_suffix: '_Tier2'
      components:
        - 'mdtuicnumber_qtcore'
  - component: $CI_SERVER_FQDN/scandyna/gitlab-ci-cd-cpp-components/Conan_Deploy_Ubuntu-24-04_gcc13_x86_64@0.0.23
    inputs:
      job_name_suffix: '_Tier3'
      components:
        - 'mdtuicnumber_qtgui'
      build_types:
        - 'Debug'
        - 'Release'
      shared_libs:
        - 'True'
  - component: $CI_SERVER_FQDN/scandyna/gitlab-ci-cd-cpp-components/Conan_Deploy_Ubuntu-24-04_clang18_x86_64_libcxx@0.0.23
    inputs:
      job_name_suffix: '_Tier3'
      components:
        - 'mdtuicnumber_qtgui'
      build_types:
        - 'Debug'
        - 'Release'
      shared_libs:
        - 'True'

Conan_Deploy_NoArch_Tier2:
  needs:
    - job: Conan_Deploy_NoArch_Tier1
      artifacts: false

Conan_Deploy_Ubuntu-24-04_gcc13_x86_64_Tier3:
  needs:
    - job: Conan_Deploy_NoArch_Tier2
      artifacts: false

Conan_Deploy_Ubuntu-24-04_clang18_x86_64_libcxx_Tier3:
  needs:
    - job: Conan_Deploy_NoArch_Tier2
      artifacts: false
