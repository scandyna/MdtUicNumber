pages:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - when: never
  dependencies:
    - BuildApiDoc
  script:
    - mkdir public
    - mv build/doc/html/* public/
  artifacts:
    paths:
      - public
